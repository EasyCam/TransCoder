<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TransCoder - 智能多语种翻译工具</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_v }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.css') }}?v={{ asset_v }}">
    <script src="{{ url_for('static', filename='js/theme.js') }}?v={{ asset_v }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}?v={{ asset_v }}"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid d-flex align-items-center">
            <span class="navbar-brand mb-0">TransCoder</span>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm lang-select" style="width: auto;" aria-label="UI language"></select>
                <button class="btn btn-light btn-sm" id="themeBtn" onclick="tcTheme.toggle()"></button>
                <button class="btn btn-light btn-sm" data-i18n="settings" onclick="showSettingsModal()">设置</button>
                <button class="btn btn-light btn-sm" data-i18n="glossary" onclick="showTerminologyModal()">术语库</button>
                <button class="btn btn-light btn-sm" onclick="showVectorDBModal()"><span data-i18n="memory">记忆库</span> <span id="tmBadge" class="badge bg-dark">0</span></button>
                <button class="btn btn-light btn-sm" data-i18n="history" onclick="openHistory()">历史</button>
                <button class="btn btn-light btn-sm" data-i18n="analytics" onclick="showAnalyticsModal()">学情</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 mt-4">
        <div class="d-flex align-items-center gap-2 mb-3">
            <button class="btn btn-sm btn-primary" id="wsTranslateBtn" onclick="switchWorkspace('translate')" data-i18n="workspaceTranslate">翻译</button>
            <button class="btn btn-sm btn-outline-primary" id="wsWritingBtn" onclick="switchWorkspace('writing')" data-i18n="workspaceWriting">写作</button>
            <button class="btn btn-sm btn-outline-primary" id="wsSpeechBtn" onclick="switchWorkspace('speech')" data-i18n="workspaceSpeech">跟读</button>
            <button class="btn btn-sm btn-outline-primary" id="wsReadingBtn" onclick="switchWorkspace('reading')" data-i18n="workspaceReading">阅读</button>
        </div>
        <div class="row g-0 workbench-row ws" id="translateWorkspace">
            <!-- 左：原文 -->
            <div class="ws-pane ws-left">
                <div class="card h-100 left-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="source">原文</h5>
                        <select id="sourceLang" class="form-select form-select-sm" style="width: auto;" aria-label="Source language">
                            <option value="auto" data-i18n="autoDetect">自动检测</option>
                            <option value="zh-cn">简体中文</option>
                            <option value="zh-tw">繁体中文</option>
                            <option value="en">English</option>
                            <option value="ja">日本語</option>
                            <option value="ko">한국어</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                            <option value="de">Deutsch</option>
                            <option value="it">Italiano</option>
                            <option value="ru">Русский</option>
                            <option value="ar">العربية</option>
                            <option value="pt">Português</option>
                        </select>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex align-items-center flex-wrap gap-2 mb-2">
                            <select id="translationMode" class="form-select form-select-sm" style="width: auto;" aria-label="Translation mode">
                                <option value="simple" data-i18n="modeSimple">简单快速翻译</option>
                                <option value="streaming" selected data-i18n="modeStreaming">流式输出翻译</option>
                                <option value="reflection" data-i18n="modeReflection">反思翻译模式</option>
                                <option value="triple" data-i18n="modeTriple">三省吾身模式</option>
                                <option value="iterative" data-i18n="modeIterative">千锤百炼模式</option>
                                <option value="team" data-i18n="modeTeam">多智能体协作（team）</option>
                            </select>
                            <div id="iterativeCountContainer" style="display: none;">
                                <select id="iterativeCount" class="form-select form-select-sm" style="width: auto;" aria-label="Iterations">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3" selected>3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                    <option value="8">8</option>
                                    <option value="10">10</option>
                                </select>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="useVectorDB" checked>
                                <label class="form-check-label" for="useVectorDB" data-i18n="useMemory">翻译记忆库</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" id="useTerminology" checked>
                                <label class="form-check-label" for="useTerminology" data-i18n="useGlossary">术语库</label>
                            </div>
                        </div>
                        <textarea id="sourceText" class="form-control flex-grow-1" rows="14"
                                  data-i18n-ph="enterSource" placeholder="请输入原文…" aria-label="Source text">{{ sample.source }}</textarea>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <div class="d-flex gap-3 align-items-center">
                                <small class="text-muted"><span data-i18n="chars">字数</span> <span id="charCount">0</span></small>
                                <small class="text-muted">{{ sample.title }}</small>
                            </div>
                            <div class="d-flex gap-2">
                                <button id="swapBtn" class="btn btn-outline-secondary btn-sm" data-i18n="swap" onclick="swapSourceAndTarget()" title="Swap source and first target">互换</button>
                                <button id="translateBtn" class="btn btn-success btn-sm" data-i18n="translate" onclick="translateText()">翻译</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="ws-splitter" onmousedown="startSplit(this, event)">
                <button class="ws-collapse" type="button" data-i18n-title="collapse" title="收起" onclick="toggleLeftPane(this)">&#10216;</button>
            </div>
            <!-- 右：译文 -->
            <div class="ws-pane ws-right">
                <div class="card h-100 right-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="translation">译文</h5>
                        <div class="d-flex align-items-center gap-2">
                            <input id="authorInput" class="form-control form-control-sm" style="width: 120px;" data-i18n-ph="author" placeholder="署名">
                            <button class="btn btn-sm btn-outline-primary" data-i18n="addLanguage" onclick="addTargetLanguage()">添加语言</button>
                        </div>
                    </div>
                    <div id="teamDegradedBanner" class="alert alert-warning py-1 px-2 mx-3 mt-2 mb-0" style="display: none; font-size: 0.85em;" role="alert">
                        <span id="teamDegradedText"></span>
                    </div>
                    <div class="card-body translation-stack" id="targetLanguages">
                        <!-- 默认添加一个目标语言 -->
                        <div class="target-lang-item" data-lang="en">
                            <div class="d-flex justify-content-between align-items-center gap-2 mb-1">
                                <select class="form-select form-select-sm target-lang-select" style="width: auto;" aria-label="Target language" onchange="checkLanguageDuplication(this)">
                                    <option value="zh-cn">简体中文</option>
                                    <option value="zh-tw">繁体中文</option>
                                    <option value="en" selected>English</option>
                                    <option value="ja">日本語</option>
                                    <option value="ko">한국어</option>
                                    <option value="es">Español</option>
                                    <option value="fr">Français</option>
                                    <option value="de">Deutsch</option>
                                    <option value="it">Italiano</option>
                                    <option value="ru">Русский</option>
                                    <option value="ar">العربية</option>
                                    <option value="pt">Português</option>
                                </select>
                                <button class="btn btn-sm btn-outline-danger" data-i18n="remove" onclick="removeTargetLanguage(this)">删除</button>
                            </div>
                            <textarea class="form-control translation-result" data-i18n-ph="translationPlaceholder" placeholder="译文（AI 生成或人工输入）" aria-label="Translation">{{ sample.en }}</textarea>
                            <div class="d-flex gap-2 flex-wrap mt-1 align-items-center">
                                <button class="btn btn-sm btn-primary" data-i18n="aiTranslate" onclick="translateSingle(this)">AI 翻译</button>
                                <button class="btn btn-sm btn-outline-success" data-i18n="quickScore" onclick="quickScore(this)">快速评分</button>
                                <button class="btn btn-sm btn-outline-primary" data-i18n="grade" onclick="gradeLanguage(this)">评分</button>
                                <button class="btn btn-sm btn-outline-primary" data-i18n="polish" onclick="polishLanguage(this)">润色纠错</button>
                                <button class="btn btn-sm btn-outline-secondary" data-i18n="annotate" onclick="beginAnnotation(this)">标注</button>
                                <button class="btn btn-sm btn-outline-secondary" data-i18n="align" onclick="autoAlign(this)">自动对应</button>
                                <button class="btn btn-sm btn-outline-secondary" data-i18n="copy" onclick="copyTranslation(this)">复制</button>
                                <span class="submission-hint muted small"></span>
                            </div>
                            <div class="quick-result mt-1"></div>
                            <div class="align-preview-src align-preview"></div>
                            <div class="align-preview-tgt align-preview"></div>
                            <div class="align-pairs mt-1"></div>
                            <div class="annotation-form mt-1" style="display:none;">
                                <div class="d-flex gap-2 align-items-center flex-wrap">
                                    <span class="annotation-quote badge bg-secondary" style="max-width: 50%; white-space: normal; text-align:left;"></span>
                                    <select class="form-select form-select-sm annotation-kind" style="width: auto;" aria-label="Annotation type">
                                        <option value="note" data-i18n="noteAttr">批注</option>
                                        <option value="grammar" data-i18n="grammar">语法</option>
                                        <option value="terminology" data-i18n="terminology">术语</option>
                                        <option value="style" data-i18n="style">风格</option>
                                    </select>
                                    <input class="form-control form-control-sm annotation-note" data-i18n-ph="notePlaceholder" style="flex:1; min-width: 160px;" placeholder="标注内容">
                                    <button class="btn btn-sm btn-primary" data-i18n="save" onclick="saveAnnotation(this)">保存</button>
                                    <button class="btn btn-sm btn-light" data-i18n="cancel" onclick="cancelAnnotation(this)">取消</button>
                                </div>
                            </div>
                            <div class="performance-metrics mt-1" style="display: none;">
                                <small class="text-muted d-flex justify-content-between">
                                    <span class="tokens-per-second"></span>
                                    <span class="translation-time"></span>
                                </small>
                            </div>
                            <div class="team-review-cards mt-1"></div>
                            <div class="evaluation-result mt-1"></div>
                            <div class="grade-result mt-1"></div>
                            <div class="polish-result mt-1"></div>
                            <div class="annotations mt-1"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 写作工作区 -->
        <div class="row g-0 workbench-row ws" id="writingWorkspace" style="display: none;">
            <div class="ws-pane ws-left" style="flex: 0 0 25%;">
                <div class="card h-100 left-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="writingPrompt">作文题</h5>
                        <button class="btn btn-sm btn-outline-primary" data-i18n="newPrompt" onclick="loadWritingPrompt()">换一题</button>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span id="writingLevel" class="badge bg-secondary">HSK</span>
                            <strong id="writingTitle"></strong>
                        </div>
                        <div id="writingPromptText" class="writing-prompt-text"></div>
                        <div class="mt-auto muted small" id="writingLengthHint"></div>
                    </div>
                </div>
            </div>
            <div class="ws-splitter" onmousedown="startSplit(this, event)">
                <button class="ws-collapse" type="button" data-i18n-title="collapse" title="收起" onclick="toggleLeftPane(this)">&#10216;</button>
            </div>
            <div class="ws-pane ws-right">
                <div class="card h-100 right-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="essay">作文</h5>
                        <div class="d-flex align-items-center gap-2">
                            <select id="writingLang" class="form-select form-select-sm" style="width: auto;" aria-label="Language" onchange="onWritingLangChange()">
                                <option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option>
                            </select>
                            <input id="writingAuthor" class="form-control form-control-sm" style="width: 120px;" data-i18n-ph="author" placeholder="署名">
                            <small class="text-muted"><span data-i18n="chars">字数</span> <span id="writingCount">0</span></small>
                        </div>
                    </div>
                    <div class="card-body translation-stack" style="overflow:hidden;">
                        <div class="target-lang-item">
                            <textarea id="writingEssay" class="form-control translation-result" data-i18n-ph="essayPlaceholder" placeholder="在这里写作文…"></textarea>
                            <div class="d-flex gap-2 flex-wrap mt-1 align-items-center">
                                <button class="btn btn-sm btn-primary" data-i18n="grade" onclick="writingGrade()">评分</button>
                                <button class="btn btn-sm btn-outline-primary" data-i18n="polish" onclick="writingPolish()">批改润色</button>
                                <button class="btn btn-sm btn-outline-secondary" data-i18n="copy" onclick="copyWriting()">复制</button>
                                <span id="writingHint" class="muted small"></span>
                            </div>
                            <div id="writingGradeResult" class="mt-1"></div>
                            <div id="writingPolishResult" class="mt-1"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 跟读工作区 -->
        <div class="row g-0 workbench-row ws" id="speechWorkspace" style="display: none;">
            <div class="ws-pane ws-left" style="flex: 0 0 40%;">
                <div class="card h-100 left-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="passage">朗读文本</h5>
                        <button class="btn btn-sm btn-outline-primary" data-i18n="newPassage" onclick="loadSpeechPassage()">换一篇</button>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <span id="speechLevel" class="badge bg-secondary">HSK</span>
                        </div>
                        <div id="speechText" class="writing-prompt-text"></div>
                        <div id="speechAnnoBtns" class="d-flex gap-1 flex-wrap mt-2"></div>
                        <div id="speechAnnotation" class="speech-annotation mt-1"></div>
                        <div class="mt-auto d-flex gap-2 align-items-center flex-wrap">
                            <button class="btn btn-sm btn-primary" data-i18n="referenceAudio" onclick="speechTTS()">参考音频</button>
                            <a id="speechDownload" class="small" style="display:none" download data-i18n="downloadAudio">下载音频</a>
                            <span id="speechTTSHint" class="muted small"></span>
                        </div>
                        <audio id="speechAudio" class="w-100 mt-2" controls style="display:none;"></audio>
                    </div>
                </div>
            </div>
            <div class="ws-splitter" onmousedown="startSplit(this, event)">
                <button class="ws-collapse" type="button" data-i18n-title="collapse" title="收起" onclick="toggleLeftPane(this)">&#10216;</button>
            </div>
            <div class="ws-pane ws-right">
                <div class="card h-100 right-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-2">
                            <select id="speechLang" class="form-select form-select-sm" style="width: auto;" aria-label="Language" onchange="onSpeechLangChange()">
                                <option value="zh">中文</option><option value="en">English</option><option value="ja">日本語</option>
                            </select>
                            <span id="speechStatus" class="muted small"></span>
                        </div>
                    </div>
                    <div class="card-body translation-stack" style="overflow:hidden;">
                        <div class="target-lang-item">
                            <div class="d-flex gap-2 flex-wrap align-items-center">
                                <button id="recordBtn" class="btn btn-sm btn-primary" data-i18n="record" onclick="toggleRecording()">录音</button>
                                <span id="recordTimer" class="muted small">0.0s</span>
                                <button id="diagnoseBtn" class="btn btn-sm btn-outline-primary" data-i18n="diagnose" onclick="speechDiagnose()" style="display:none;">详细诊断</button>
                            </div>
                            <audio id="recordAudio" class="w-100 mt-2" controls style="display:none;"></audio>
                            <div id="speechResult" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 阅读工作区 -->
        <div class="row g-0 workbench-row ws" id="readingWorkspace" style="display: none;">
            <div class="ws-pane ws-left" style="flex: 0 0 55%;">
                <div class="card h-100 left-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="workspaceReading">阅读</h5>
                        <div class="d-flex align-items-center gap-2 flex-wrap">
                            <select id="readingExam" class="form-select form-select-sm" style="width: auto;" aria-label="Exam" onchange="onReadingExamChange()">
                                <option value="cet4">CET-4</option>
                                <option value="cet6">CET-6</option>
                                <option value="kaoyan">考研英语</option>
                                <option value="jlpt">JLPT</option>
                                <option value="hsk">HSK</option>
                            </select>
                            <select id="readingYear" class="form-select form-select-sm" style="width: auto;" aria-label="Year" onchange="onReadingYearChange()"></select>
                            <select id="readingPaper" class="form-select form-select-sm" style="width: auto;" aria-label="Paper" onchange="onReadingPaperChange()"></select>
                            <select id="readingPick" class="form-select form-select-sm" style="width: auto; max-width: 220px;" aria-label="Article" onchange="openReadingArticle(this.value)"></select>
                            <button class="btn btn-sm btn-outline-primary" data-i18n="newArticle" onclick="loadReadingArticle()">换一篇</button>
                            <button class="btn btn-sm btn-outline-secondary" data-i18n="importArticle" onclick="showReadingImport()">导入</button>
                            <button class="btn btn-sm btn-link p-0" id="readingDeleteBtn" style="display:none" data-i18n="deleteArticle" onclick="deleteReadingArticle()">删除</button>
                        </div>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h6 id="readingTitle" class="mb-2"></h6>
                        <div id="readingPassage" class="reading-passage"></div>
                    </div>
                </div>
            </div>
            <div class="ws-splitter" onmousedown="startSplit(this, event)">
                <button class="ws-collapse" type="button" data-i18n-title="collapse" title="收起" onclick="toggleLeftPane(this)">&#10216;</button>
            </div>
            <div class="ws-pane ws-right">
                <div class="card h-100 right-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0" data-i18n="questions" >题目</h5>
                        <button class="btn btn-sm btn-primary" data-i18n="submitAnswers" onclick="submitReading()">提交答案</button>
                    </div>
                    <div class="card-body translation-stack" style="overflow:hidden;">
                        <div class="target-lang-item">
                            <div id="readingQuestions"></div>
                            <div id="readingResult" class="mt-2"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 导入阅读材料 -->
    <div class="modal fade" id="readingImportModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="importArticle">导入</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label small" data-i18n="realPapers">真题库（GitHub）</label>
                        <div class="d-flex gap-2 flex-wrap align-items-center">
                            <select id="ghSource" class="form-select form-select-sm" style="width: auto;" onchange="loadGithubOptions()">
                                <option value="kaoyan1">考研英语一</option>
                                <option value="kaoyan2">考研英语二</option>
                                <option value="cet4">CET-4</option>
                                <option value="cet6">CET-6</option>
                            </select>
                            <select id="ghYear" class="form-select form-select-sm" style="width: auto;"></select>
                            <button class="btn btn-sm btn-outline-secondary" data-i18n="refreshList" onclick="loadGithubOptions()">刷新</button>
                            <button class="btn btn-sm btn-primary" data-i18n="fetchImport" onclick="fetchRealPapers()">抓取导入</button>
                            <span id="ghStatus" class="muted small"></span>
                        </div>
                        <small class="muted" data-i18n="realPapersHint">从公开 GitHub 仓库下载到本机题库，不写入仓库</small>
                    </div>
                    <hr>
                    <div class="row g-2 mb-2">
                        <div class="col-4">
                            <label class="form-label small" data-i18n="exam">考试</label>
                            <select id="impExam" class="form-select form-select-sm">
                                <option value="cet4">CET-4</option>
                                <option value="cet6">CET-6</option>
                                <option value="kaoyan">考研英语</option>
                                <option value="jlpt">JLPT</option>
                                <option value="hsk">HSK</option>
                            </select>
                        </div>
                        <div class="col-4">
                            <label class="form-label small" data-i18n="year">年份</label>
                            <input id="impYear" class="form-control form-control-sm" placeholder="2023">
                        </div>
                        <div class="col-4">
                            <label class="form-label small" data-i18n="paper">卷别</label>
                            <input id="impPaper" class="form-control form-control-sm" placeholder="12月 / 英语一">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" data-i18n="articleTitle">标题</label>
                        <input id="impTitle" class="form-control form-control-sm">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" data-i18n="passageText">文章正文</label>
                        <textarea id="impPassage" class="form-control" rows="8"></textarea>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small" data-i18n="questionsJson">题目（JSON）</label>
                        <textarea id="impQuestions" class="form-control" rows="6"
                                  placeholder='[{"q":"...","options":["A","B","C","D"],"answer":1,"explain":"..."}]'></textarea>
                    </div>
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="muted" data-i18n="importHint">本地保存，不写入仓库</small>
                        <button class="btn btn-sm btn-primary" data-i18n="save" onclick="saveReadingImport()">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 历史 -->
    <div class="modal fade" id="historyModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="history">历史</h5>
                    <button type="button" class="btn btn-sm btn-outline-danger me-2" data-i18n="clearAll" onclick="clearHistory()">清空</button>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="historyList" class="small"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 学情看板 -->
    <div class="modal fade" id="analyticsModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="analytics">学情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="analyticsBody" class="small muted" data-i18n="loading">加载中…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 术语库模态框 -->
    <div class="modal fade" id="terminologyModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="glossaryTitle">术语库管理</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <h6 data-i18n="importGlossary">导入术语库</h6>
                        <input type="file" id="terminologyFile" class="form-control"
                               accept=".csv,.xlsx,.tbx,.json" aria-label="Glossary file">
                        <button class="btn btn-primary mt-2" data-i18n="upload" onclick="uploadTerminology()">上传</button>
                    </div>
                    <div class="mb-3">
                        <h6 data-i18n="exportGlossary">导出术语库</h6>
                        <select id="exportFormat" class="form-select mb-2" aria-label="Export format">
                            <option value="csv">CSV</option>
                            <option value="xlsx">Excel</option>
                            <option value="tbx">TBX</option>
                            <option value="json">JSON</option>
                        </select>
                        <button class="btn btn-success" data-i18n="export" onclick="exportTerminology()">导出</button>
                    </div>
                    <div>
                        <h6 data-i18n="addTerm">添加新术语</h6>
                        <input type="text" id="newTerm" class="form-control mb-2" data-i18n-ph="term" placeholder="术语" aria-label="Term">
                        <div id="termTranslations">
                            <div class="row mb-2">
                                <div class="col-3">
                                    <select class="form-select term-lang" aria-label="Term language">
                                        <option value="zh-cn">简体中文</option>
                                        <option value="zh-tw">繁体中文</option>
                                        <option value="en">English</option>
                                        <option value="ja">日本語</option>
                                    </select>
                                </div>
                                <div class="col-9">
                                    <input type="text" class="form-control term-translation"
                                           data-i18n-ph="translation" placeholder="翻译" aria-label="Term translation">
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-sm btn-secondary" data-i18n="addLangBtn" onclick="addTermTranslation()">添加语言</button>
                        <button class="btn btn-primary" data-i18n="saveTerm" onclick="saveTerm()">保存术语</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 向量数据库模态框 -->
    <div class="modal fade" id="vectorDBModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="memoryTitle">翻译记忆库管理</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <h6 data-i18n="overview">概况</h6>
                        <div id="tmStats" class="small text-muted" data-i18n="loading">加载中…</div>
                    </div>
                    <div class="mb-3">
                        <h6 data-i18n="search">检索</h6>
                        <div class="input-group">
                            <input type="text" id="tmQuery" class="form-control" data-i18n-ph="searchPlaceholder" placeholder="检索原文…">
                            <button class="btn btn-outline-primary" data-i18n="search" onclick="searchTM()">检索</button>
                        </div>
                        <div id="tmResults" class="mt-2"></div>
                    </div>
                    <div class="mb-3">
                        <h6 data-i18n="importTmx">导入TMX文件</h6>
                        <input type="file" id="tmxFile" class="form-control" accept=".tmx" aria-label="TMX file">
                        <button class="btn btn-primary mt-2" data-i18n="uploadTmx" onclick="uploadTMX()">上传</button>
                    </div>
                    <div class="mb-3">
                        <h6 data-i18n="exportMemory">导出翻译记忆</h6>
                        <button class="btn btn-success" data-i18n="exportTmx" onclick="exportTMX()">导出TMX</button>
                    </div>
                    <div>
                        <h6 data-i18n="addCurrent">添加当前翻译到记忆库</h6>
                        <button class="btn btn-primary" data-i18n="addToMemory" onclick="addToVectorDB()">添加到记忆库</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="modal fade" id="settingsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" data-i18n="settings">设置</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <h6 data-i18n="topicTitle">翻译模型</h6>
                        <label class="form-label small" for="endpointSelect" data-i18n="endpoint">端点</label>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <select id="endpointSelect" class="form-select form-select-sm" aria-label="Translation endpoint">
                            </select>
                            <span id="endpointStatus" class="badge bg-light text-dark">…</span>
                        </div>
                        <label class="form-label small" for="ollamaModel" data-i18n="model">模型</label>
                        <select id="ollamaModel" class="form-select form-select-sm" aria-label="Translation model">
                        </select>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h6 data-i18n="reviewTitle">评审模型</h6>
                        <label class="form-label small" for="reviewerEndpointSelect" data-i18n="endpoint">端点</label>
                        <div class="d-flex align-items-center gap-2 mb-2">
                            <select id="reviewerEndpointSelect" class="form-select form-select-sm" aria-label="Reviewer endpoint">
                            </select>
                            <span id="reviewerEndpointStatus" class="badge bg-light text-dark">…</span>
                        </div>
                        <label class="form-label small" for="reviewerModelSelect" data-i18n="model">模型</label>
                        <select id="reviewerModelSelect" class="form-select form-select-sm" aria-label="Reviewer model">
                        </select>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h6 data-i18n="reviewRounds">评审轮数</h6>
                        <select id="teamRounds" class="form-select form-select-sm" aria-label="Review rounds">
                            <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <h6 data-i18n="reviewStrategy">评审策略</h6>
                        <select id="reviewStrategy" class="form-select form-select-sm" aria-label="Review strategy">
                            <option value="auto" data-i18n="strategyAuto">自动：云端优先，本地兜底</option>
                            <option value="online" data-i18n="strategyOnline">仅在线评审</option>
                            <option value="local" data-i18n="strategyLocal">仅本地评审</option>
                            <option value="none" data-i18n="strategyNone">关闭评审（仅自我反思）</option>
                        </select>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h6 data-i18n="endpointManager">端点管理</h6>
                        <div id="endpointManager" class="small mb-2"></div>
                        <div class="border rounded p-2">
                            <div class="row g-2">
                                <div class="col-6">
                                    <input id="epName" class="form-control form-control-sm" data-i18n-ph="epName" placeholder="名称">
                                </div>
                                <div class="col-6">
                                    <input id="epBaseUrl" class="form-control form-control-sm" data-i18n-ph="epBaseUrl" placeholder="Base URL（…/v1）">
                                </div>
                                <div class="col-6">
                                    <input id="epKey" type="password" class="form-control form-control-sm" data-i18n-ph="epKey" placeholder="API Key（可留空）">
                                </div>
                                <div class="col-6">
                                    <input id="epModels" class="form-control form-control-sm" data-i18n-ph="epModels" placeholder="模型名，逗号分隔">
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <small class="muted" data-i18n="keyHint">密钥只写入本机配置文件</small>
                                <button class="btn btn-sm btn-primary" data-i18n="saveEndpoint" onclick="saveManualEndpoint()">保存端点</button>
                            </div>
                        </div>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h6 data-i18n="contentLibrary">内容库</h6>
                        <div class="small">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span data-i18n="readingBank">阅读题库</span>
                                <span>
                                    <button class="btn btn-sm btn-link p-0 me-2" data-i18n="exportContent" onclick="exportContent('reading')">导出</button>
                                    <label class="btn btn-sm btn-link p-0 m-0" style="cursor:pointer"><span data-i18n="importContent">导入</span>
                                        <input type="file" accept=".json" style="display:none" onchange="importContent('reading', this)">
                                    </label>
                                </span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <span data-i18n="writingBank">写作题库</span>
                                <span>
                                    <button class="btn btn-sm btn-link p-0 me-2" data-i18n="exportContent" onclick="exportContent('writing')">导出</button>
                                    <label class="btn btn-sm btn-link p-0 m-0" style="cursor:pointer"><span data-i18n="importContent">导入</span>
                                        <input type="file" accept=".json" style="display:none" onchange="importContent('writing', this)">
                                    </label>
                                </span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center">
                                <span data-i18n="speechBank">跟读文本</span>
                                <span>
                                    <button class="btn btn-sm btn-link p-0 me-2" data-i18n="exportContent" onclick="exportContent('speech')">导出</button>
                                    <label class="btn btn-sm btn-link p-0 m-0" style="cursor:pointer"><span data-i18n="importContent">导入</span>
                                        <input type="file" accept=".json" style="display:none" onchange="importContent('speech', this)">
                                    </label>
                                </span>
                            </div>
                        </div>
                        <small id="contentStatus" class="muted"></small>
                    </div>
                    <hr>
                    <div class="mb-3">
                        <h6 data-i18n="proxy">网络代理</h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="useProxy">
                            <label class="form-check-label" for="useProxy" data-i18n="useProxy">使用代理</label>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="proxyUrl" data-i18n="proxyAddr">代理地址</label>
                            <input type="text" id="proxyUrl" class="form-control"
                                   placeholder="socks5://127.0.0.1:7897">
                        </div>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-between">
                    <div class="d-flex gap-3">
                        <a class="small" href="/terminology" data-i18n="manageGlossary">术语管理</a>
                        <a class="small" href="/vector-db" data-i18n="manageMemory">记忆库管理</a>
                    </div>
                    <div>
                        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal" data-i18n="cancel">取消</button>
                        <button type="button" class="btn btn-primary btn-sm" data-i18n="saveSettings" onclick="saveSettings()">保存设置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_v }}"></script>
</body>
</html>
